

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="../Estilos/Estilos.css">
</head>
<body>

<div class="container">
<h1>Agrega los Productos</h1>

    <label>Nombre:</label>
    <input type="text" id="nombre" placeholder="Ej: Laptop Gamer">

    <label>Precio:</label>
    <input type="number" id="precio" step="0.01">

    <label>Stock:</label>
    <input type="number" id="stock" placeholder="Ej: 3">

    <label>ID del Usuario:</label>
    <input type="number" id="userId" placeholder="Ej: 1">

     <label>ID del Producto (para actualizar/eliminar):</label>
    <input type="number" id="productId">

    <button type="button" onclick="createProduct()">Crear Producto</button>
    <button type="button" onclick="updateProduct()">Actualizar Producto</button>
    <button type="button" onclick="deleteProduct()">Eliminar Producto</button>

     <ul id="result"></ul>
</div>

<script src="../JS/addProducto.js"></script>
</body>
</html>
